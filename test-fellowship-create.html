<!DOCTYPE html>
<html>
<head>
    <title>Test Fellowship Creation</title>
</head>
<body>
    <h1>Test Fellowship Creation</h1>
    
    <div>
        <h2>Step 1: Login</h2>
        <input type="email" id="email" placeholder="Email" value="daniel@kairos.church" />
        <input type="password" id="password" placeholder="Password" value="DanielPass123!" />
        <button onclick="login()">Login</button>
        <div id="loginResult"></div>
    </div>

    <div>
        <h2>Step 2: Create Fellowship</h2>
        <input type="text" id="fellowshipName" placeholder="Fellowship Name" value="Test Fellowship" />
        <select id="fellowshipType">
            <option value="K-Groups">K-Groups</option>
            <option value="Kharis Express">Kharis Express</option>
            <option value="New Breeds">New Breeds</option>
            <option value="Kharis on Campus">Kharis on Campus</option>
            <option value="Kharis on Campus Colleges">Kharis on Campus Colleges</option>
        </select>
        <button onclick="createFellowship()">Create Fellowship</button>
        <div id="createResult"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <script>
        const API_URL = 'https://fiozyca9ah.execute-api.eu-west-2.amazonaws.com';
        const USER_POOL_ID = 'eu-west-2_pcXtxTuhu';
        const CLIENT_ID = '51g4egqn15ukgho80mbgsdi5r3';
        
        let idToken = null;

        const poolData = {
            UserPoolId: USER_POOL_ID,
            ClientId: CLIENT_ID
        };
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const authenticationData = {
                Username: email,
                Password: password,
            };
            const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails(authenticationData);
            
            const userData = {
                Username: email,
                Pool: userPool
            };
            const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);
            
            cognitoUser.authenticateUser(authenticationDetails, {
                onSuccess: function(result) {
                    idToken = result.getIdToken().getJwtToken();
                    document.getElementById('loginResult').innerHTML = '<p style="color: green;">✓ Login successful! Token: ' + idToken.substring(0, 50) + '...</p>';
                    console.log('ID Token:', idToken);
                },
                onFailure: function(err) {
                    document.getElementById('loginResult').innerHTML = '<p style="color: red;">✗ Login failed: ' + err.message + '</p>';
                    console.error('Login error:', err);
                }
            });
        }

        async function createFellowship() {
            if (!idToken) {
                alert('Please login first!');
                return;
            }

            const payload = {
                fellowship_name: document.getElementById('fellowshipName').value,
                fellowship_type: document.getElementById('fellowshipType').value,
                branch_id: 20,
                description: 'Test fellowship created from test page',
                meeting_schedule: 'Wednesdays 7pm',
                location: 'Test Location'
            };

            console.log('Creating fellowship with payload:', payload);
            console.log('Using token:', idToken.substring(0, 50) + '...');

            try {
                const response = await fetch(`${API_URL}/v1/fellowships`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify(payload)
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok) {
                    document.getElementById('createResult').innerHTML = '<p style="color: green;">✓ Fellowship created successfully! ID: ' + data.fellowship_id + '</p>';
                } else {
                    document.getElementById('createResult').innerHTML = '<p style="color: red;">✗ Failed: ' + JSON.stringify(data) + '</p>';
                }
            } catch (error) {
                document.getElementById('createResult').innerHTML = '<p style="color: red;">✗ Error: ' + error.message + '</p>';
                console.error('Create error:', error);
            }
        }
    </script>
</body>
</html>
