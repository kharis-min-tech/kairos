appId: ${EXPO_GO_APP_ID}
name: Wave 3 navigation smoke (Expo Go) — CRUD + admin surfaces load
tags:
  - smoke
  - wave3
env:
  # Android Expo Go bundle id. iOS is host.exp.Exponent (capital E).
  EXPO_GO_APP_ID: "host.exp.exponent"
  # EMAIL, PASSWORD, METRO_URL, BRANCH_NAME MUST be passed via --env at run
  # time. Do NOT set defaults here — Maestro 2.x's flow env block always wins
  # over CLI --env.
---
- launchApp:
    clearState: true
    clearKeychain: true

- openLink: "${METRO_URL}"

- extendedWaitUntil:
    visible:
      text: "KAIROS"
    timeout: 120000

- runFlow:
    file: 00-onboarding.yaml
    env:
      APP_ID: ${EXPO_GO_APP_ID}
      BRANCH_NAME: ${BRANCH_NAME}

- runFlow:
    file: 10-login.yaml
    env:
      APP_ID: ${EXPO_GO_APP_ID}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}

- runFlow:
    file: 50-fellowships-crud.yaml
    env:
      APP_ID: ${EXPO_GO_APP_ID}

- runFlow:
    file: 51-departments-crud.yaml
    env:
      APP_ID: ${EXPO_GO_APP_ID}

- runFlow:
    file: 52-members-crud.yaml
    env:
      APP_ID: ${EXPO_GO_APP_ID}

- runFlow:
    file: 53-branches-regions.yaml
    env:
      APP_ID: ${EXPO_GO_APP_ID}

- runFlow:
    file: 54-outreach-souls.yaml
    env:
      APP_ID: ${EXPO_GO_APP_ID}

- runFlow:
    file: 55-security-attendance.yaml
    env:
      APP_ID: ${EXPO_GO_APP_ID}

- runFlow:
    file: 30-sign-out.yaml
    env:
      APP_ID: ${EXPO_GO_APP_ID}
