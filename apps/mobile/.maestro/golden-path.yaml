appId: com.kharis.kairos
name: Golden path — first-run onboarding, login, tab tour, sign out
tags:
  - smoke
env:
  EMAIL: ""
  PASSWORD: ""
  BRANCH_NAME: "Kharis"
---
- runFlow:
    file: 00-onboarding.yaml
    env:
      BRANCH_NAME: ${BRANCH_NAME}
- runFlow:
    file: 10-login.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
- runFlow: 20-tab-navigation.yaml
- runFlow: 30-sign-out.yaml
