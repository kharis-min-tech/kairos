appId: ${APP_ID}
name: Fellowship register — landing → fellowship view (no destructive save)
tags:
  - smoke
  - rollcall
env:
  APP_ID: "com.kharis.kairos"
---
# Idempotent — safe to run in isolation. Doesn't tap "Start today's meeting",
# which would create a persistent meeting row.
#
# NOTE: this flow was stale before 2026-10-04 — it tapped text "Rollcall" in
# the More menu, but that row has read "Fellowship attendance" for a while, so
# it could never have matched. Copy now matches the app: the row and the
# landing header say "Fellowship attendance", the landing's intro says "Take
# the register", and the per-meeting screen header says "Register".
#
# /rollcall auto-forwards to /rollcall/[id] when the user leads exactly one
# fellowship, so either destination is valid and each is asserted on its own.

- tapOn: "More"
- extendedWaitUntil:
    visible:
      text: "For you"
    timeout: 8000

- scrollUntilVisible:
    element:
      text: "Fellowship attendance"
    direction: DOWN
    timeout: 8000
    speed: 40
- tapOn:
    text: "Fellowship attendance"
    # Index 0 = the More menu row; the landing screen's header carries the
    # same words, so take the first match.
    index: 0

# Proves we actually left the More tab, whichever destination rendered.
- extendedWaitUntil:
    notVisible:
      text: "For you"
    timeout: 10000

# (a) Single-fellowship user — auto-redirected to the meeting picker.
- runFlow:
    when:
      visible:
        text: "Meetings"
    commands:
      - assertVisible:
          text: "Start today's meeting"

# (b) Multi- or no-fellowship user — the fellowship picker landing.
- runFlow:
    when:
      visible:
        text: "Take the register"
    commands:
      - assertVisible:
          text: "Take the register"

# Back to More. Two back-presses handle the auto-redirect case: one out of the
# meeting-picker, one out of the landing (Expo Router keeps both on the stack).
# The second back is unconditional — pressing back on the More tab is a no-op
# so it's safe when we were only one screen deep.
- pressKey: Back
- pressKey: Back
