appId: ${APP_ID}
name: More menu — full taxonomy visible
tags:
  - smoke
  - navigation
env:
  APP_ID: "com.kharis.kairos"
---
# Assumes a signed-in PRIVILEGED session — "Gatherings" and "Organisation"
# are capability-gated and a plain member sees neither.
#
# Section headers are the plain-noun nav taxonomy (2026-10-04): clusters named
# for what they contain, shared with the web sidebar. A regression here means
# a section got renamed or dropped. Replaces the 2026-08-08 grouping
# ("My groups", "Leader tools", "Forms", "Reports & analytics"), whose rows
# were redistributed rather than removed.

- tapOn: "More"

- extendedWaitUntil:
    visible:
      text: "For you"
    timeout: 8000

- scrollUntilVisible:
    element:
      text: "People"
    direction: DOWN
    timeout: 8000
    speed: 40

- scrollUntilVisible:
    element:
      text: "Groups"
    direction: DOWN
    timeout: 8000
    speed: 40

- scrollUntilVisible:
    element:
      text: "Gatherings"
    direction: DOWN
    timeout: 8000
    speed: 40

- scrollUntilVisible:
    element:
      text: "Insights"
    direction: DOWN
    timeout: 8000
    speed: 40

- scrollUntilVisible:
    element:
      text: "Organisation"
    direction: DOWN
    timeout: 8000
    speed: 40

- scrollUntilVisible:
    element:
      text: "Settings"
    direction: DOWN
    timeout: 8000
    speed: 40

- scrollUntilVisible:
    element:
      text: "Help"
    direction: DOWN
    timeout: 8000
    speed: 40
