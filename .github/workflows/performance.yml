name: Performance

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**/*'
      - 'libs/**/*'
  schedule:
    # Run performance tests weekly
    - cron: '0 6 * * 1'

jobs:
  lighthouse-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build applications
        run: |
          npx nx build web-admin --configuration=production
          npx nx build member-app --configuration=production

      - name: Run Lighthouse CI for Web Admin
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './apps/web-admin/.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Run Lighthouse CI for Member App
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './apps/member-app/.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  bundle-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Analyze bundle size
        run: |
          echo "Analyzing bundle sizes..."

          # Build with bundle analysis
          npx nx build web-admin --configuration=production
          npx nx build member-app --configuration=production

          # Generate bundle reports (if webpack-bundle-analyzer is configured)
          echo "Bundle analysis completed"
          echo "Check build outputs for bundle size information"

      - name: Comment bundle size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## Bundle Size Analysis

            📦 **Bundle analysis completed**

            The applications have been built and analyzed for bundle size.

            ### Next.js Build Output
            - Web Admin: Check build logs for detailed size information
            - Member App: Check build logs for detailed size information

            ### Recommendations
            - Monitor for significant size increases
            - Consider code splitting for large bundles
            - Use dynamic imports for non-critical code

            ---
            *This comment is automatically generated by the Performance workflow*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  load-testing:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run load tests
        run: |
          echo "Running load tests against staging environment..."
          echo "This would typically use tools like:"
          echo "  - Artillery.io for API load testing"
          echo "  - k6 for performance testing"
          echo "  - Playwright for browser-based load testing"

          # Placeholder for actual load testing commands
          # Example:
          # npx artillery run load-test-config.yml

          echo "Load testing completed"
