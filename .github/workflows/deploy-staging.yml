name: Deploy staging

# Every push to `staging`: run the gate, then migrate the staging database and
# deploy the Worker. Cloudflare Pages builds the web app from the same push on
# its own, so it is not part of this workflow.

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Never cancel a deploy half way through a migration; queue the next one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate and deploy the Worker
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Worker bundles the workspace packages from their built output.
      - name: Build the Worker's dependencies
        run: npx turbo build --filter=@kairos/api^...

      # The dry run lists what is pending in the job log before anything
      # changes; the real run then applies only what the journal lacks.
      - name: Migrations (preview)
        run: npm run db:bootstrap --workspace=@kairos/database -- --dry-run

      - name: Migrations (apply)
        run: npm run db:bootstrap --workspace=@kairos/database

      - name: Deploy the Worker
        working-directory: apps/api
        run: npx wrangler deploy --env staging
