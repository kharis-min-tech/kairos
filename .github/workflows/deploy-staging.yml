name: Deploy staging

# Every push to `staging`: run the gate, then migrate the staging database and
# deploy the Worker. Cloudflare Pages builds the web app from the same push on
# its own, so it is not part of this workflow. When the merge changed anything
# the app is built from, the iOS (to TestFlight) and Android builds are queued
# once the Worker is live.

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Never cancel a deploy half way through a migration; queue the next one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate and deploy the Worker
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Worker bundles the workspace packages from their built output.
      - name: Build the Worker's dependencies
        run: npx turbo build --filter=@kairos/api^...

      # The dry run lists what is pending in the job log before anything
      # changes; the real run then applies only what the journal lacks.
      - name: Migrations (preview)
        run: npm run db:bootstrap --workspace=@kairos/database -- --dry-run

      - name: Migrations (apply)
        run: npm run db:bootstrap --workspace=@kairos/database

      - name: Deploy the Worker
        working-directory: apps/api
        run: npx wrangler deploy --env staging

  # Did this push touch anything the mobile app is built from?
  changes:
    name: Detect mobile changes
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A manual run or an unknown base builds, to be safe.
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" \
            | grep -qE '^(apps/mobile/|packages/(ui-native|api-client|types|core|utils)/|package-lock\.json)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: iOS build to TestFlight
    needs: [deploy, changes]
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile-build.yml
    secrets: inherit
    with:
      platform: ios
      profile: preview-ios
      submit: true

  android:
    name: Android preview build
    needs: [deploy, changes]
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile-build.yml
    secrets: inherit
    with:
      platform: android
      profile: preview
