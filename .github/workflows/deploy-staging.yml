name: Deploy to Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  AWS_REGION: eu-west-2
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/api/dist/
            apps/web/.next/
            apps/web/out/
            infrastructure/dist/
          retention-days: 1

  deploy:
    name: Deploy CDK Stacks to Staging
    runs-on: ubuntu-latest
    needs: [build]
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CDK stacks to staging
        run: npx cdk deploy --all -c env=staging --require-approval never
        working-directory: infrastructure

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run smoke tests
        run: |
          echo "Running staging smoke tests..."

          # Health check on API Gateway
          API_URL="${{ vars.STAGING_API_URL }}"
          if [ -n "$API_URL" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/v1/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API health check passed (HTTP $STATUS)"
            else
              echo "API health check returned HTTP $STATUS (non-200 may be expected if no /health route)"
            fi
          else
            echo "STAGING_API_URL not configured, skipping API health check"
          fi

          # Verify CDK stacks are deployed
          echo "Verifying staging stacks..."
          aws cloudformation describe-stacks --query "Stacks[?contains(StackName, 'kairos-staging')].{Name:StackName,Status:StackStatus}" --output table

          echo "Smoke tests complete"
