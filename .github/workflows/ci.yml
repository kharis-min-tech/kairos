name: CI

# The gate every change must pass before it can reach staging or production:
# build, lint, typecheck and test the whole monorepo, and prove the web app
# builds for Cloudflare Pages. Deploy workflows depend on this one.

# Pushes to `staging` are gated by deploy-staging.yml, which calls this
# workflow, so listing `staging` here as well would run the gate twice.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Build-time public values. Real values are only needed where a build is
  # deployed; CI just needs the build to succeed.
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NEXT_PUBLIC_MAPBOX_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build first, then the rest. Run together, the web typecheck reads
      # .next/types while `next build` is still rewriting it and fails with
      # TS6053 "file not found" — a race, not a real error.
      - name: Build
        run: npx turbo build

      # --continue reports every failing task in one run instead of turbo
      # cancelling the rest at the first failure (which once hid the API suite
      # behind a mobile failure).
      - name: Lint and typecheck
        run: npx turbo lint typecheck --continue

      # One suite at a time. The web, mobile and API suites are each heavy and
      # each spawns its own workers; run together on a 2-4 core runner they
      # starve each other into timeouts that have nothing to do with the code.
      - name: Test
        run: npx turbo test --continue --concurrency=1

  # `next build` passing does not mean Cloudflare Pages will accept the app:
  # next-on-pages rejects any dynamic route that is not on the edge runtime,
  # and that only fails at deploy time. This job reproduces the Pages build.
  pages:
    name: Cloudflare Pages build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build workspace packages
        run: npx turbo build --filter=@kairos/web^...

      - name: next-on-pages build
        run: npm run pages:build --workspace=@kairos/web
