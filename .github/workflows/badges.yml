name: Update Badges

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['CI', 'Security']
    types: [completed]

jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README badges
        run: |
