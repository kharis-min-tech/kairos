# Kairos Demo Stack
# ─────────────────────────────────────────────────────────────────────────────
# One-command demo:
#   docker compose -f docker-compose.demo.yml up --build
#
# Open http://localhost:3002 in your browser.
# Default demo credentials seeded by the database:  admin@kairos.church / Password1!
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:15-alpine
    container_name: kairos-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    ports:
      - "5430:5430"
    volumes:
      - kairos-demo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kairos-demo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kairos:kairos@postgres:5432/kairos
      JWT_SECRET: demo-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: demo-jwt-refresh-secret-not-for-production
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: kairos-demo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3002
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://kairos-demo-api:3001
    ports:
      - "3002:3002"

volumes:
  kairos-demo-pgdata:
