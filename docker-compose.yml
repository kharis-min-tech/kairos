services:
  postgres:
    image: postgres:15-alpine
    container_name: kairos-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    volumes:
      - kairos-pgdata:/var/lib/postgresql/data

volumes:
  kairos-pgdata:
