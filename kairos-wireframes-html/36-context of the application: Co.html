<div id="mobile-payment-form" class="min-h-[100vh] bg-white">
  <!-- Header -->
  <header id="header" class="bg-white border-b border-neutral-200 px-4 py-3">
    <div class="flex items-center justify-between">
      <button class="flex items-center space-x-2 text-neutral-800">
        <i class="fa-solid fa-arrow-left text-lg"></i>
        <span class="text-sm">Back</span>
      </button>
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-church text-xl text-neutral-800"></i>
        <span class="text-lg text-neutral-800">KCMS</span>
      </div>
      <button class="text-neutral-600">
        <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="px-4 py-6">
    <!-- Page Title -->
    <div id="page-header" class="mb-6">
      <h1 class="text-2xl text-neutral-900 mb-2">Record New Payment</h1>
      <p class="text-neutral-600 text-sm">Manually add cash, card, or transfer payment</p>
    </div>

    <!-- Payment Form -->
    <form id="payment-form" class="space-y-6">
      <!-- Payment Type Selection -->
      <div id="payment-type-section" class="space-y-3">
        <label class="text-sm text-neutral-700 block">Payment Type</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" class="flex flex-col items-center justify-center p-4 border-2 border-neutral-900 bg-neutral-50 rounded-lg text-neutral-900">
            <i class="fa-solid fa-money-bills text-xl mb-2"></i>
            <span class="text-xs">Cash</span>
          </button>
          <button type="button" class="flex flex-col items-center justify-center p-4 border border-neutral-300 bg-white rounded-lg text-neutral-600">
            <i class="fa-solid fa-credit-card text-xl mb-2"></i>
            <span class="text-xs">Card</span>
          </button>
          <button type="button" class="flex flex-col items-center justify-center p-4 border border-neutral-300 bg-white rounded-lg text-neutral-600">
            <i class="fa-solid fa-money-bill-transfer text-xl mb-2"></i>
            <span class="text-xs">Transfer</span>
          </button>
        </div>
      </div>

      <!-- Member Selection -->
      <div id="member-section" class="space-y-2">
        <label class="text-sm text-neutral-700 block">Member</label>
        <div class="relative">
          <input type="text" class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500 focus:border-transparent" placeholder="Search member name or ID">
          <i class="fa-solid fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-neutral-400"></i>
        </div>
        
        <!-- Selected Member Card -->
        <div class="bg-neutral-50 rounded-lg p-3 flex items-center space-x-3 mt-3">
          <img src="https://api.dicebear.com/7.x/notionists/svg?scale=200&seed=4521" class="w-10 h-10 rounded-full">
          <div class="flex-1">
            <p class="text-sm text-neutral-900">Sarah Johnson</p>
            <p class="text-xs text-neutral-600">ID: KCM-2024-0156</p>
          </div>
          <button type="button" class="text-neutral-400">
            <i class="fa-solid fa-times text-sm"></i>
          </button>
        </div>
      </div>

      <!-- Payment Category -->
      <div id="category-section" class="space-y-2">
        <label class="text-sm text-neutral-700 block">Payment Category</label>
        <select class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500 focus:border-transparent text-neutral-900">
          <option value="">Select category</option>
          <option value="tithe">Tithe</option>
          <option value="offering">Offering</option>
          <option value="seed">Seed Offering</option>
          <option value="building">Building Fund</option>
          <option value="missions">Missions</option>
          <option value="thanksgiving">Thanksgiving</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- Amount -->
      <div id="amount-section" class="space-y-2">
        <label class="text-sm text-neutral-700 block">Amount</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-neutral-600">₦</span>
          <input type="number" class="w-full pl-8 pr-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500 focus:border-transparent text-neutral-900" placeholder="0.00" step="0.01">
        </div>
      </div>

      <!-- Payment Date -->
      <div id="date-section" class="space-y-2">
        <label class="text-sm text-neutral-700 block">Payment Date</label>
        <div class="relative">
          <input type="date" class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500 focus:border-transparent text-neutral-900" value="2025-01-15">
          <i class="fa-solid fa-calendar absolute right-3 top-1/2 transform -translate-y-1/2 text-neutral-400"></i>
        </div>
      </div>

      <!-- Reference Number -->
      <div id="reference-section" class="space-y-2">
        <label class="text-sm text-neutral-700 block">Reference Number</label>
        <input type="text" class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500 focus:border-transparent" placeholder="Optional - Transaction/Receipt ID">
      </div>

      <!-- Service/Event -->
      <div id="service-section" class="space-y-2">
        <label class="text-sm text-neutral-700 block">Service/Event</label>
        <select class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500 focus:border-transparent text-neutral-900">
          <option value="">Select service</option>
          <option value="sunday-first">Sunday First Service</option>
          <option value="sunday-second">Sunday Second Service</option>
          <option value="wednesday">Wednesday Bible Study</option>
          <option value="friday">Friday Revival</option>
          <option value="special-event">Special Event</option>
          <option value="online">Online Service</option>
        </select>
      </div>

      <!-- Notes -->
      <div id="notes-section" class="space-y-2">
        <label class="text-sm text-neutral-700 block">Notes</label>
        <textarea class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500 focus:border-transparent resize-none" rows="3" placeholder="Additional notes or comments (optional)"></textarea>
      </div>

      <!-- Payment Method Details (for Card/Transfer) -->
      <div id="payment-details" class="space-y-4 hidden">
        <div class="bg-neutral-50 rounded-lg p-4 space-y-3">
          <h3 class="text-sm text-neutral-800 flex items-center">
            <i class="fa-solid fa-credit-card mr-2"></i>
            Card Payment Details
          </h3>
          <div class="space-y-3">
            <input type="text" class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm" placeholder="Last 4 digits">
            <input type="text" class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm" placeholder="Bank name">
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div id="action-buttons" class="space-y-3 pt-4">
        <button type="submit" class="w-full bg-neutral-900 text-white py-3 px-4 rounded-lg hover:bg-neutral-800 transition-colors flex items-center justify-center">
          <i class="fa-solid fa-check mr-2"></i>
          Record Payment
        </button>
        
        <button type="button" class="w-full border border-neutral-300 text-neutral-700 py-3 px-4 rounded-lg hover:bg-neutral-50 transition-colors flex items-center justify-center">
          <i class="fa-solid fa-save mr-2"></i>
          Save as Draft
        </button>
      </div>

      <!-- Quick Actions -->
      <div id="quick-actions" class="bg-neutral-50 rounded-lg p-4 space-y-3">
        <h3 class="text-sm text-neutral-800 flex items-center">
          <i class="fa-solid fa-bolt mr-2"></i>
          Quick Actions
        </h3>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" class="text-xs text-neutral-600 py-2 px-3 border border-neutral-300 rounded-lg bg-white hover:bg-neutral-50">
            <i class="fa-solid fa-camera mr-1"></i>
            Scan Receipt
          </button>
          <button type="button" class="text-xs text-neutral-600 py-2 px-3 border border-neutral-300 rounded-lg bg-white hover:bg-neutral-50">
            <i class="fa-solid fa-copy mr-1"></i>
            Duplicate Last
          </button>
        </div>
      </div>
    </form>
  </main>

  <!-- Footer -->
  <footer id="footer" class="px-4 py-4 border-t border-neutral-200 bg-white">
    <div class="flex items-center justify-between text-xs text-neutral-500">
      <span>© 2025 KCMS</span>
      <div class="flex items-center space-x-1">
        <i class="fa-solid fa-shield-alt"></i>
        <span>Secure Payment Entry</span>
      </div>
    </div>
  </footer>
</div>
