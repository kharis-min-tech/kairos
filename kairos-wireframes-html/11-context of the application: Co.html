<div id="mobile-add-edit-member" class="min-h-[100vh] bg-white">
  <!-- Header -->
  <header id="header" class="bg-white border-b border-neutral-200 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <button class="p-2 -ml-2 rounded-lg hover:bg-neutral-100">
          <i class="fa-solid fa-arrow-left text-neutral-700"></i>
        </button>
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-church text-xl text-neutral-800"></i>
          <span class="text-lg text-neutral-800">KCMS</span>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button class="p-2 rounded-lg hover:bg-neutral-100">
          <i class="fa-solid fa-question-circle text-neutral-600"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="px-4 py-6 pb-20">
    <!-- Page Header -->
    <div id="page-header" class="mb-6">
      <div class="flex items-center space-x-3 mb-2">
        <div class="w-10 h-10 bg-neutral-800 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-user-plus text-white text-sm"></i>
        </div>
        <div>
          <h1 class="text-xl text-neutral-900">Add New Member</h1>
          <p class="text-sm text-neutral-600">Enter member information below</p>
        </div>
      </div>
    </div>

    <!-- Form Container -->
    <div id="member-form-container" class="space-y-6">
      <form class="space-y-6">
        <!-- Personal Information Section -->
        <div id="personal-info-section" class="bg-neutral-50 rounded-lg p-4">
          <h3 class="text-sm text-neutral-800 mb-4 flex items-center">
            <i class="fa-solid fa-user mr-2"></i>
            Personal Information
          </h3>
          
          <div class="space-y-4">
            <!-- Profile Photo -->
            <div class="flex flex-col items-center space-y-3">
              <div class="w-20 h-20 bg-neutral-300 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-camera text-neutral-600 text-xl"></i>
              </div>
              <button type="button" class="text-sm text-neutral-700 px-3 py-1 border border-neutral-300 rounded-lg">
                Upload Photo
              </button>
            </div>

            <!-- First Name -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">First Name *</label>
              <input type="text" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500" placeholder="Enter first name">
            </div>

            <!-- Last Name -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Last Name *</label>
              <input type="text" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500" placeholder="Enter last name">
            </div>

            <!-- Date of Birth -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Date of Birth</label>
              <input type="date" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500">
            </div>

            <!-- Gender -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Gender</label>
              <select class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500">
                <option>Select gender</option>
                <option>Male</option>
                <option>Female</option>
              </select>
            </div>

            <!-- Marital Status -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Marital Status</label>
              <select class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500">
                <option>Select status</option>
                <option>Single</option>
                <option>Married</option>
                <option>Divorced</option>
                <option>Widowed</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Contact Information Section -->
        <div id="contact-info-section" class="bg-neutral-50 rounded-lg p-4">
          <h3 class="text-sm text-neutral-800 mb-4 flex items-center">
            <i class="fa-solid fa-phone mr-2"></i>
            Contact Information
          </h3>
          
          <div class="space-y-4">
            <!-- Email -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Email Address *</label>
              <input type="email" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500" placeholder="Enter email address">
            </div>

            <!-- Phone Number -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Phone Number *</label>
              <input type="tel" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500" placeholder="Enter phone number">
            </div>

            <!-- Address -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Address</label>
              <textarea class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500 h-20" placeholder="Enter full address"></textarea>
            </div>

            <!-- Emergency Contact -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Emergency Contact Name</label>
              <input type="text" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500" placeholder="Enter contact name">
            </div>

            <!-- Emergency Contact Phone -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Emergency Contact Phone</label>
              <input type="tel" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500" placeholder="Enter contact phone">
            </div>
          </div>
        </div>

        <!-- Church Information Section -->
        <div id="church-info-section" class="bg-neutral-50 rounded-lg p-4">
          <h3 class="text-sm text-neutral-800 mb-4 flex items-center">
            <i class="fa-solid fa-church mr-2"></i>
            Church Information
          </h3>
          
          <div class="space-y-4">
            <!-- Member ID -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Member ID</label>
              <input type="text" class="w-full px-3 py-2 border border-neutral-300 rounded-lg bg-neutral-100" placeholder="Auto-generated" readonly>
            </div>

            <!-- Join Date -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Join Date *</label>
              <input type="date" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500">
            </div>

            <!-- Branch -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Branch *</label>
              <select class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500">
                <option>Select branch</option>
                <option>Main Campus</option>
                <option>North Branch</option>
                <option>South Branch</option>
                <option>East Branch</option>
              </select>
            </div>

            <!-- Department -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Department</label>
              <select class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500">
                <option>Select department</option>
                <option>Youth Ministry</option>
                <option>Children Ministry</option>
                <option>Worship Team</option>
                <option>Media Team</option>
                <option>Ushering</option>
                <option>Prayer Ministry</option>
              </select>
            </div>

            <!-- House Group -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">House Group</label>
              <select class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500">
                <option>Select house group</option>
                <option>Victory House Group</option>
                <option>Grace House Group</option>
                <option>Faith House Group</option>
                <option>Hope House Group</option>
              </select>
            </div>

            <!-- Membership Status -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Membership Status *</label>
              <select class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500">
                <option>Active</option>
                <option>Inactive</option>
                <option>Pending</option>
                <option>Transferred</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Spiritual Information Section -->
        <div id="spiritual-info-section" class="bg-neutral-50 rounded-lg p-4">
          <h3 class="text-sm text-neutral-800 mb-4 flex items-center">
            <i class="fa-solid fa-cross mr-2"></i>
            Spiritual Information
          </h3>
          
          <div class="space-y-4">
            <!-- Salvation Date -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Salvation Date</label>
              <input type="date" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500">
            </div>

            <!-- Baptism Status -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Baptism Status</label>
              <select class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500">
                <option>Not Baptized</option>
                <option>Baptized</option>
                <option>Scheduled</option>
              </select>
            </div>

            <!-- Baptism Date -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Baptism Date</label>
              <input type="date" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500">
            </div>

            <!-- Leadership Role -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Leadership Role</label>
              <select class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500">
                <option>None</option>
                <option>House Group Leader</option>
                <option>Department Head</option>
                <option>Pastor</option>
                <option>Elder</option>
                <option>Deacon</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Additional Notes Section -->
        <div id="notes-section" class="bg-neutral-50 rounded-lg p-4">
          <h3 class="text-sm text-neutral-800 mb-4 flex items-center">
            <i class="fa-solid fa-note-sticky mr-2"></i>
            Additional Notes
          </h3>
          
          <div class="space-y-4">
            <!-- Special Needs -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Special Needs/Medical Conditions</label>
              <textarea class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500 h-20" placeholder="Enter any special needs or medical conditions"></textarea>
            </div>

            <!-- Skills/Talents -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">Skills/Talents</label>
              <textarea class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500 h-20" placeholder="Enter member's skills or talents"></textarea>
            </div>

            <!-- General Notes -->
            <div class="space-y-2">
              <label class="text-sm text-neutral-700 block">General Notes</label>
              <textarea class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-500 h-20" placeholder="Enter any additional notes"></textarea>
            </div>
          </div>
        </div>

        <!-- Privacy Settings -->
        <div id="privacy-section" class="bg-neutral-50 rounded-lg p-4">
          <h3 class="text-sm text-neutral-800 mb-4 flex items-center">
            <i class="fa-solid fa-shield-halved mr-2"></i>
            Privacy & Permissions
          </h3>
          
          <div class="space-y-3">
            <label class="flex items-center space-x-3">
              <input type="checkbox" class="w-4 h-4 border border-neutral-300 rounded">
              <span class="text-sm text-neutral-700">Allow directory listing</span>
            </label>
            <label class="flex items-center space-x-3">
              <input type="checkbox" class="w-4 h-4 border border-neutral-300 rounded">
              <span class="text-sm text-neutral-700">Send email notifications</span>
            </label>
            <label class="flex items-center space-x-3">
              <input type="checkbox" class="w-4 h-4 border border-neutral-300 rounded">
              <span class="text-sm text-neutral-700">Send SMS notifications</span>
            </label>
            <label class="flex items-center space-x-3">
              <input type="checkbox" class="w-4 h-4 border border-neutral-300 rounded" checked>
              <span class="text-sm text-neutral-700">Include in reports</span>
            </label>
          </div>
        </div>
      </form>
    </div>
  </main>

  <!-- Fixed Bottom Action Bar -->
  <div id="action-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-neutral-200 px-4 py-3">
    <div class="flex space-x-3">
      <button type="button" class="flex-1 px-4 py-3 border border-neutral-300 rounded-lg text-neutral-700 bg-white hover:bg-neutral-50">
        <i class="fa-solid fa-eye mr-2"></i>
        Preview
      </button>
      <button type="submit" class="flex-1 px-4 py-3 bg-neutral-900 text-white rounded-lg hover:bg-neutral-800">
        <i class="fa-solid fa-save mr-2"></i>
        Save Member
      </button>
    </div>
  </div>

  <!-- Success Toast (Hidden by default) -->
  <div id="success-toast" class="fixed top-20 left-4 right-4 bg-white border border-neutral-200 rounded-lg p-4 shadow-lg hidden">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 bg-neutral-100 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-check text-neutral-600 text-sm"></i>
      </div>
      <div>
        <p class="text-sm text-neutral-900">Member saved successfully!</p>
        <p class="text-xs text-neutral-600">John Doe has been added to the system</p>
      </div>
      <button class="ml-auto p-1">
        <i class="fa-solid fa-times text-neutral-400"></i>
      </button>
    </div>
  </div>
</div>
